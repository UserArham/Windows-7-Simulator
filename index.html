<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 7 Simulator</title>

<link href="icon/favicon (7).ico" rel="icon" type="image/x-icon">
<link rel="stylesheet" href="https://unpkg.com/7.css">

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: url("https://4kwallpapers.com/images/walls/thumbs_3t/13944.jpg") center/cover no-repeat;
    font-family: "Segoe UI", sans-serif;
    cursor: url("https://upload.wikimedia.org/wikipedia/commons/e/e9/Windows_Vista_Aero_arrow_32x32-32.png"), auto;
}

#desktop {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 40px;
    overflow: hidden;
    z-index: 0;
}

#desktop::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(
        rgba(255,255,255,0.05) 1px,
        transparent 1px
    );
    background-size: 20px 20px;
    pointer-events: none;
}

#taskbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: rgba(30,30,30,0.85);
    display: flex;
    align-items: center;
    z-index: 1000;
}

#start-orb {
    width: 40px;
    height: 40px;
    background: url("https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/i/78b5b005-0417-4396-8f67-32fe902c68e5/dqaheo-27476279-79ad-45d0-b87d-32f1c7cd9aa5.png") center/cover;
    cursor: pointer;
}

#taskbar-apps {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 40px;
    margin-left: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    flex: 1;
    min-width: 0;
}

#taskbar-apps::-webkit-scrollbar {
    height: 0;
}

.taskbar-app {
    width: 38px;
    height: 34px;
    padding: 0;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 3px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-sizing: border-box;
}

.taskbar-app:hover {
    background: rgba(255,255,255,0.18);
}

.taskbar-app.active {
    background: rgba(255,255,255,0.22);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}

.taskbar-app img {
    width: 22px;
    height: 22px;
    object-fit: contain;
}

#taskbar-clock {
    margin-left: auto;
    margin-right: 8px;
    font-family: "Segoe UI", sans-serif;
    font-size: 14px;
    color: white;
    cursor: default;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
}

#taskbar-menu {
    position: absolute;
    bottom: 40px;
    right: 8px;
    display: none;
    flex-direction: column;
    gap: 4px;
    z-index: 1500;
}

/* ONLY CHANGE: rectangular Restart / Shutdown buttons */
#taskbar-menu button {
    all: unset;
    display: block;
    padding: 6px 12px;
    font-family: "Segoe UI";
    cursor: pointer;
    border-radius: 0;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    box-sizing: border-box;
}

#taskbar-menu button:hover {
    background: rgba(0,120,215,0.25);
}

#start-menu {
    position: fixed;
    bottom: 40px;
    left: 0;
    width: 260px;
    display: none;
    z-index: 1200;
}

#start-menu .window-body {
    padding: 0;
}

.menu {
    list-style: none;
    margin: 0;
    padding: 4px;
}

.menu-item {
    padding: 6px 10px;
    cursor: pointer;
}

.menu-item:hover {
    background: rgba(0,120,215,0.25);
}

.window {
    min-width: 320px;
    min-height: 220px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    z-index: 500;
    position: absolute;
    background: #fff;
    border-radius: 4px;
}

.window-body {
    padding: 12px;
    height: calc(100% - 32px);
    box-sizing: border-box;
    overflow: auto;
}

.title-bar-controls button:hover {
    filter: brightness(1.2);
    cursor: pointer;
}

.palette {
    display: grid;
    grid-template-columns: repeat(8, 16px);
    gap: 3px;
    padding: 4px;
}

.color {
    width: 16px;
    height: 16px;
    cursor: pointer;
}

.ms {
    display: grid;
    grid-template-columns: repeat(10, 24px);
}

.cell {
    width: 24px;
    height: 24px;
    background: #ccc;
    border: 1px solid #999;
    text-align: center;
    line-height: 24px;
    user-select: none;
    cursor: pointer;
}

#shutdown-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: black;
    z-index: 9999;
}

/* Browser tabs */

#ietabs,
#chrometabs,
#edgetabs {
    display: flex;
    align-items: center;
    gap: 0;
    background: #d6d6d6;
    padding: 0 6px;
    height: 34px;
    border-bottom: 1px solid #999;
}

.tab {
    padding: 4px 12px;
    height: 32px;
    line-height: 32px;
    border: 1px solid #bbb;
    border-bottom: none;
    border-radius: 3px 3px 0 0;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    background: linear-gradient(
        to bottom,
        #f8f8f8 0%,
        #eaeaea 100%
    );
    font-size: 13px;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #333;
    position: relative;
    clip-path: polygon(
        4% 0%,
        96% 0%,
        100% 100%,
        0% 100%
    );
}

.tab.active {
    background: #fff;
    border-bottom: 1px solid #fff;
    font-weight: 500;
    z-index: 1;
}

.tab:hover {
    background: linear-gradient(
        to bottom,
        #fefefe 0%,
        #e4e4e4 100%
    );
}

.tab button {
    border: none;
    background: transparent;
    font-size: 12px;
    line-height: 12px;
    padding: 0;
    cursor: pointer;
    color: #888;
}

.tab button:hover {
    color: #f33;
}

.new-tab {
    width: 40px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid #bbb;
    border-bottom: none;
    border-radius: 3px 3px 0 0;
    background: linear-gradient(
        to bottom,
        #f8f8f8 0%,
        #eaeaea 100%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-left: 2px;
}

.new-tab:hover {
    background: linear-gradient(
        to bottom,
        #fefefe 0%,
        #e4e4e4 100%
    );
}

.address-bar {
    display: flex;
    align-items: center;
    padding: 3px 6px;
    background: #e0e0e0;
    border-bottom: 1px solid #bbb;
}

.address-bar input {
    flex: 1;
    margin-left: 6px;
    height: 28px;
    font-size: 13px;
    padding: 3px 6px;
    border: 1px solid #aaa;
    border-radius: 2px;
}

.browser-content {
    flex: 1;
    border: 0;
    width: 100%;
    height: 100%;
}

/* Edge-specific controls */

.edge-toolbar {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px;
    background: #f5f5f5;
    border-bottom: 1px solid #ccc;
}

.edge-toolbar button {
    min-width: 28px;
    height: 28px;
}

.edge-address {
    flex: 1;
    height: 28px;
    box-sizing: border-box;
    padding: 3px 10px;
    border: 1px solid #aaa;
    border-radius: 14px;
    outline: none;
    font-size: 13px;
}

/* MSN Messenger */

.msn-header {
    display: flex;
    align-items: center;
    padding: 10px;
    background: linear-gradient(
        to bottom,
        #e9f7ff,
        #c8eaff
    );
    border-bottom: 1px solid #9ccbe8;
}

.msn-header img {
    width: 40px;
    height: 40px;
    margin-right: 10px;
}

.msn-name {
    font-size: 18px;
    font-weight: bold;
}

.msn-status {
    color: #008000;
    font-size: 12px;
}

.msn-contacts {
    padding: 8px;
}

.msn-contact {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
}

.msn-contact:hover {
    background: #e8f5ff;
}

.msn-green {
    display: inline-block;
    width: 9px;
    height: 9px;
    background: #35a853;
    border-radius: 50%;
    margin-right: 6px;
}
</style>
</head>

<body>

<div id="desktop"></div>

<!-- START MENU -->

<div id="start-menu" class="window">

    <div class="window-body">

        <div style="
            display:flex;
            align-items:center;
            padding:6px;
        ">

            <img
                id="user-icon"
                src="https://www.rw-designer.com/icon-image/22554-256x256x8.png"
                alt="User"
                width="32"
                height="32"
                style="margin-right:8px;"
            >

            <span>Administrator</span>

        </div>

        <menu class="menu">

            <li
                class="menu-item"
                onclick="openApp('ie')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://img.apponic.com/113/198/0d27a46dc4aabe1b3c4a90fb05883e04.png"
                    alt="Internet Explorer"
                    width="16"
                    height="16"
                    style="margin-right:6px;"
                >
                Internet Explorer
            </li>

            <li
                class="menu-item"
                onclick="openApp('chrome')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Google_Chrome_icon_%28February_2022%29.svg/60px-Google_Chrome_icon_%28February_2022%29.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail&_=20231015142139"
                    alt="Google Chrome"
                    width="16"
                    height="16"
                    style="margin-right:6px;"
                >
                Google Chrome
            </li>

            <li
                class="menu-item"
                onclick="openApp('edge')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWLAuNokAOwWRjcsp11SeC9IgxGbj4Fmj6Kl--RJje4A&s"
                    alt="Microsoft Edge"
                    width="16"
                    height="16"
                    style="margin-right:6px;"
                >
                Microsoft Edge
            </li>

            <li
                class="menu-item"
                onclick="openApp('msn')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/4/43/MSN_messenger_icon.png"

                    width="16"

                >
                MSN Messenger
            </li>

            <li
                class="menu-item"
                onclick="openApp('paint')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://frutigeraeroarchive.org/images/sketchbook.png"
                    alt="Paint"

                    height="16"
                    style="margin-right:6px;"
                >

            </li>

            <li
                class="menu-item"
                onclick="openApp('mine')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://cdn2.steamgriddb.com/icon/1e14bfe2714193e7af5abc64ecbd6b46/32/256x256.png"
                    alt="Minesweeper"

                    height="16"

                >
                Minesweeper
            </li>

            <li
                class="menu-item"
                onclick="openApp('notepad')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://images.icon-icons.com/191/PNG/256/Notepad_23093.png"
                    alt="Notepad"
                    width="16"
                    height="16"
                    style="margin-right:6px;"
                >
                Notepad
            </li>

            <li
                class="menu-item"
                onclick="openApp('wmp')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://www.clipartmax.com/png/middle/15-159149_windows-windows-media-player-logo.png"
                    alt="Windows Media Player"
                    width="16"
                    height="16"
                    style="margin-right:6px;"
                >
                Windows Media Player
            </li>

            <li
                class="menu-item"
                onclick="openApp('installer')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://images.icon-icons.com/54/PNG/256/installation_application_software_10810.png"
                    alt="Installer"
                    width="16"
                    height="16"
                    style="margin-right:6px;"
                >
                Web App Installer
            </li>

            <li
                class="menu-item"
                onclick="openApp('diary')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://icons.veryicon.com/png/System/Vistoon/EXE%20file.png"
                    alt="Diary"

                    height="16"
                    style="margin-right:6px;"
                >
                Diary
            </li>

            <li
                class="menu-item"
                onclick="openApp('control')"
                style="display:flex;align-items:center;"
            >
                <img
                    src="https://www.pngkey.com/png/full/336-3368717_admindashboard-windows-control-panel-icon.png"

                Control Panel
            </li>

        </menu>
    </div>
</div>

<!-- TASKBAR -->

<div id="taskbar">

    <div id="start-orb"></div>

    <div id="taskbar-apps"></div>

    <div id="taskbar-menu">

        <button onclick="restartSimulator()">
            Restart
        </button>

        <button onclick="shutdownSimulator()">
            Shutdown
        </button>

    </div>

    <div id="taskbar-clock">
        00:00:00 AM
    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

    let z = 1;

    window.ms = new Set();
    window.pc = "#000";

    const startOrb =
        document.getElementById("start-orb");

    const startMenu =
        document.getElementById("start-menu");

    const clockEl =
        document.getElementById("taskbar-clock");

    const menuEl =
        document.getElementById("taskbar-menu");

    const userIcon =
        document.getElementById("user-icon");

    const taskbarApps =
        document.getElementById("taskbar-apps");

    const taskbarIcons = {
        "Internet Explorer 11":
            "https://img.apponic.com/113/198/0d27a46dc4aabe1b3c4a90fb05883e04.png",

        "Google Chrome":
            "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Google_Chrome_icon_%28February_2022%29.svg/60px-Google_Chrome_icon_%28February_2022%29.svg.png",

        "Microsoft Edge 109":
            "https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Microsoft_Edge_logo_%282019%29.svg/120px-Microsoft_Edge_logo_%282019%29.svg.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail",

        "MSN Messenger":
            "https://upload.wikimedia.org/wikipedia/commons/4/43/MSN_messenger_icon.png",

        "Paint":
            "https://frutigeraeroarchive.org/images/sketchbook.png",

        "Minesweeper":
            "https://cdn2.steamgriddb.com/icon/1e14bfe2714193e7af5abc64ecbd6b46/32/256x256.png",

        "Notepad":
            "https://images.icon-icons.com/191/PNG/256/Notepad_23093.png",

        "Windows Media Player":
            "https://www.clipartmax.com/png/middle/15-159149_windows-windows-media-player-logo.png",

        "Web App Installer":
            "https://images.icon-icons.com/54/PNG/256/installation_application_software_10810.png",

        "Diary":
            "https://icons.veryicon.com/png/System/Vistoon/EXE%20file.png",

        "Control Panel":
            "https://www.pngkey.com/png/full/336-3368717_admindashboard-windows-control-panel-icon.png"
    };

    function addTaskbarButton(win, title) {

        if (!taskbarApps || !win) return;

        const button =
            document.createElement("button");

        button.className =
            "taskbar-app active";

        button.type =
            "button";

        button.title =
            title;

        button.setAttribute(
            "aria-label",
            title
        );

        const img =
            document.createElement("img");

        img.src =
            taskbarIcons[title] || "";

        img.alt =
            title;

        button.appendChild(img);

        button.onclick = () => {

            if (!document.body.contains(win)) {
                button.remove();
                return;
            }

            if (win.style.display === "none") {
                win.style.display = "block";
            }

            document
                .querySelectorAll(".window")
                .forEach(other => {
                    other.classList.remove("active");
                });

            win.classList.add("active");

            z++;

            win.style.zIndex = z;

            updateTaskbarButtons(win);
        };

        taskbarApps.appendChild(button);

        button._window =
            win;

        win._taskbarButton =
            button;
    }

    function removeTaskbarButton(win) {

        if (
            win &&
            win._taskbarButton
        ) {

            win._taskbarButton.remove();

            win._taskbarButton =
                null;
        }
    }

    function updateTaskbarButtons(activeWin) {

        document
            .querySelectorAll(".taskbar-app")
            .forEach(btn => {
                btn.classList.remove("active");
            });

        if (
            activeWin &&
            activeWin._taskbarButton
        ) {

            activeWin
                ._taskbarButton
                .classList.add("active");
        }
    }


    /* START MENU */

    startOrb.onclick = () => {

        startMenu.style.display =
            startMenu.style.display === "block"
            ? "none"
            : "block";

        if (
            startMenu.style.display ===
            "block"
        ) {

            z++;

            startMenu.style.zIndex =
                z;
        }
    };


    /* CLOCK MENU */

    clockEl.onclick = () => {

        menuEl.style.display =
            menuEl.style.display === "flex"
            ? "none"
            : "flex";

        if (
            menuEl.style.display ===
            "flex"
        ) {

            z++;

            menuEl.style.zIndex =
                z;
        }
    };


    /* CLOCK */

    function updateClock() {

        const now =
            new Date();

        let h =
            now.getHours();

        let m =
            now.getMinutes();

        let s =
            now.getSeconds();

        const ampm =
            h >= 12
            ? "PM"
            : "AM";

        h =
            h % 12 || 12;

        clockEl.innerText =
            `${h.toString().padStart(2,"0")}:` +
            `${m.toString().padStart(2,"0")}:` +
            `${s.toString().padStart(2,"0")} ${ampm}`;
    }

    updateClock();

    setInterval(
        updateClock,
        1000
    );


    /* RESTART */

    function resetSimulator() {

        document
            .querySelectorAll(".window")
            .forEach(w => {

                if (
                    w.id !==
                    "start-menu"
                ) {

                    w.remove();
                }
            });

        startMenu.style.display =
            "none";

        menuEl.style.display =
            "none";

        if (taskbarApps) {
            taskbarApps.innerHTML =
                "";
        }

        window.ms =
            new Set();

        window.pc =
            "#000";

        document.body.style.background =
            "url('https://4kwallpapers.com/images/walls/thumbs_3t/13944.jpg') center/cover no-repeat";

        z = 1;
    }

    window.restartSimulator =
        resetSimulator;


    /* SHUTDOWN */

    window.shutdownSimulator = () => {

        const overlay =
            document.createElement("div");

        overlay.id =
            "shutdown-overlay";

        document.body.appendChild(
            overlay
        );
    };


    /* DRAGGABLE WINDOWS */

    function makeDraggable(win) {

        const titleBar =
            win.querySelector(
                ".title-bar"
            );

        if (!titleBar)
            return;

        let offsetX = 0;
        let offsetY = 0;
        let dragging = false;

        titleBar.style.cursor =
            "move";

        titleBar.addEventListener(
            "mousedown",
            e => {

                if (
                    e.target.closest(
                        "button"
                    )
                ) {
                    return;
                }

                dragging = true;

                const rect =
                    win.getBoundingClientRect();

                offsetX =
                    e.clientX -
                    rect.left;

                offsetY =
                    e.clientY -
                    rect.top;

                z++;

                win.style.zIndex =
                    z;
            }
        );

        document.addEventListener(
            "mousemove",
            e => {

                if (!dragging)
                    return;

                win.style.left =
                    e.clientX -
                    offsetX +
                    "px";

                win.style.top =
                    e.clientY -
                    offsetY +
                    "px";
            }
        );

        document.addEventListener(
            "mouseup",
            () => {
                dragging = false;
            }
        );
    }


    /* CREATE WINDOW */

    window.createWindow =
        (title, body) => {

        const w =
            document.createElement(
                "div"
            );

        w.className =
            "window active";

        w.style.width =
            "500px";

        w.style.height =
            "350px";

        w.style.left =
            (60 +
            Math.random() * 100) +
            "px";

        w.style.top =
            (60 +
            Math.random() * 60) +
            "px";

        w.style.zIndex =
            z++;

        w.innerHTML = `

            <div class="title-bar">

                <div class="title-bar-text">
                    ${title}
                </div>

                <div class="title-bar-controls">

                    <button
                        aria-label="Minimize"
                        onclick="minimize(this)"
                    ></button>

                    <button
                        aria-label="Maximize"
                        onclick="maximize(this)"
                    ></button>

                    <button
                        aria-label="Close"
                        onclick="closeW(this)"
                    ></button>

                </div>

            </div>

            <div class="window-body">
                ${body}
            </div>
        `;

        document
            .getElementById(
                "desktop"
            )
            .appendChild(w);

        w.addEventListener(
            "mousedown",
            () => {

                document
                    .querySelectorAll(
                        ".window"
                    )
                    .forEach(win =>
                        win.classList.remove(
                            "active"
                        )
                    );

                w.classList.add(
                    "active"
                );

                z++;

                w.style.zIndex =

            w.dataset.old =
                JSON.stringify({
                    w: w.style.width,
                    h: w.style.height,
                    t: w.style.top,
                    l: w.style.left
                });

            w.style.width =
                "100%";

            w.style.height =
                "calc(100% - 40px)";

            w.style.top =
                "0";

            w.style.left =
                "0";

        } else {

            const old =
                JSON.parse(
                    w.dataset.old
                );

            w.style.width =
                old.w;

            w.style.height =
                old.h;

            w.style.top =
                old.t;

                <iframe
                    class="browser-content"
                    id="${app}frame"
                    src="${home}"
                ></iframe>

            </div>
            `
        );

        window[`${app}Tabs`] = [
            {
                title: "New Tab",
                url: home
            }
        ];

        window.currentTab = browser => {

            const tabs =
                Array.from(
                    document
                        .getElementById(
                            browser + "tabs"
                        )
                        .querySelectorAll(
                            ".tab"
                        )
                );

            const index =
                tabs.findIndex(
                    t =>
                        t.classList.contains(

                );

            return window[
                `${browser}Tabs`
            ][
                Math.max(
                    index,
                    0
                )
            ];
        };

        window[`${app}Go`] = () => {

            const tab =
                currentTab(app);

            const bar =
                document.getElementById(
                    app + "bar"
                );

            const frame =
                document.getElementById(
                    app + "frame"
                );

            if (
                !bar ||
                !frame ||
                !tab
            ) {
                return;
            }

            let url =
                bar.value.trim();

            if (!url)
                return;

            if (
                !url.startsWith(
                    "http://"
                ) &&
                !url.startsWith(
                    "https://"
                )
            ) {

                url =
                    "https://" +
                    url;
            }

            tab.url =
                url;

            frame.src =
                url;
        };

        window.newTab = browser => {

            const tabsEl =
                document.getElementById(
                    browser + "tabs"
                );

            const homeUrl =
                "google.html";

            const browserIcon =
                browser === "chrome"
                ? "https://upload.wikimedia.org/wikipedia/commons/0/0e/Google_Chrome_icon_%28March_2011%29.svg"
                : "https://img.apponic.com/113/198/0d27a46dc4aabe1b3c4a90fb05883e04.png";

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "tab";

            div.innerHTML = `

                <img
                    src="${browserIcon}"
                    width="16"
                    height="16"
                >

                <span>
                    New Tab
                </span>

                <button
                    onclick="
                        closeTab(
                            event,
                            this,
                            '${browser}'
                        )
                    "
                >
                    x
                </button>
            `;

            div.onclick = () =>
                switchTab(
                    div,
                    browser
                );

            tabsEl.insertBefore(
                div,
                tabsEl.lastElementChild
            );

            window[
                `${browser}Tabs`
            ].push({
                title:"New Tab",
                url:homeUrl
            });

            switchTab(
                div,
                browser
            );
        };

        window.switchTab =
            (tab,browser) => {

            document
                .getElementById(
                    browser + "tabs"
                )
                .querySelectorAll(
                    ".tab"
                )
                .forEach(t =>
                    t.classList.remove(
                        "active"
                    )
                );

            tab.classList.add(
                "active"
            );

            const data =
                currentTab(
                    browser
                );

            document.getElementById(
                browser + "bar"
            ).value =
                data.url;

            document.getElementById(
                browser + "frame"
            ).src =
                data.url;
        };

        window.closeTab =
            (event,btn,browser) => {

            event.stopPropagation();

            const tab =
                btn.parentElement;

            const tabsEl =
                document.getElementById(
                    browser + "tabs"
                );

            const tabs =
                Array.from(
                    tabsEl.querySelectorAll(
                        ".tab"
                    )
                );

            const index =
                tabs.indexOf(tab);

            window[
                `${browser}Tabs`
            ].splice(
                index,
                1
            );

            tab.remove();

            const remaining =
                tabsEl.querySelectorAll(
                    ".tab"
                );

            if (!remaining.length) {

                const frame =
                    document.getElementById(
                        browser + "frame"
                    );

                if (frame) {

                    const win =
                        frame.closest(
                            ".window"
                        );

                    if (win) {

                        removeTaskbarButton(
                            win
                        );

                        win.remove();
                    }
                }

                return;
            }

            const active =
                tabsEl.querySelector(
                    ".tab.active"
                );

            if (!active) {

                switchTab(
                    remaining[
                        Math.max(
                            0,
                            index - 1
                        )
                    ],
                    browser
                );
            }
        };
    }

    function openEdge() {

        const edgeIcon =

        createWindow(

                    >

                    </button>

                </div>

                <div class="edge-toolbar">

                    <button
                        onclick="edgeBack()"
                        title="Back"
                    >
                        &lt;
                    </button>

                    <button
                        onclick="edgeForward()"
                        title="Forward"
                    >
                        &gt;
                    </button>

                    <button
                        onclick="edgeReload()"
                        title="⟳"
                    >
                        ⟳
                    </button>

                    <input
                        id="edgebar"
                        class="edge-address"
                        value="${home}"
                        onkeydown="
                            if(event.key==='Enter')
                                edgeGo()
                        "
                    >

                    <button
                        onclick="edgeGo()"
                    >
                        Go
                    </button>

                </div>

                <iframe
                    id="edgeframe"
                    class="browser-content"
                    src="${home}"
                ></iframe>

            </div>
            `
        );

        window.edgeTabs = [
            {
                title: "New tab",
                url: home,
                history: [home],
                historyIndex: 0
            }
        ];

        window.edgeCurrentTab = () => {

            const tabs =
                Array.from(
                    document
                        .getElementById(
                            "edgetabs"
                        )
                        .querySelectorAll(
                            ".tab"
                        )
                );

            const index =
                tabs.findIndex(
                    t =>
                        t.classList.contains(
                            "active"
                        )
                );

            return edgeTabs[
                Math.max(
                    index,
                    0
                )
            ];
        };

        window.edgeGo = () => {

            const bar =
                document.getElementById(
                    "edgebar"
                );

            const frame =
                document.getElementById(
                    "edgeframe"
                );

            const tab =
                edgeCurrentTab();

            if (
                !bar ||
                !frame ||
                !tab
            )
                return;

            let url =
                bar.value.trim();

            if (!url)
                return;

            if (
                !url.startsWith(
                    "http://"
                ) &&
                !url.startsWith(
                    "https://"
                )
            ) {

                url =
                    "https://" +
                    url;
            }

            if (
                tab.history[
                    tab.historyIndex
                ] !== url
            ) {

                tab.history =
                    tab.history.slice(
                        0,
                        tab.historyIndex + 1
                    );

                tab.history.push(
                    url
                );

                tab.historyIndex =
                    tab.history.length - 1;
            }

            tab.url =
                url;

            bar.value =
                url;

            frame.src =
                url;
        };

        window.edgeBack = () => {

            const tab =
                edgeCurrentTab();

            if (
                tab.historyIndex <= 0
            ) {
                return;
            }

            tab.historyIndex--;

            tab.url =
                tab.history[
                    tab.historyIndex
                ];

            document.getElementById(
                "edgebar"
            ).value =
                tab.url;

            document.getElementById(
                "edgeframe"
            ).src =
                tab.url;
        };

        window.edgeForward = () => {

            const tab =
                edgeCurrentTab();

            if (
                tab.historyIndex >=
                tab.history.length - 1
            ) {
                return;
            }

            tab.historyIndex++;

            tab.url =
                tab.history[
                    tab.historyIndex
                ];

            document.getElementById(
                "edgebar"
            ).value =
                tab.url;

            document.getElementById(
                "edgeframe"
            ).src =
                tab.url;
        };

        window.edgeReload = () => {

            const frame =
                document.getElementById(
                    "edgeframe"
                );

            if (frame) {
                frame.src =
                    frame.src;
            }
        };

        window.edgeNewTab = () => {

            const tabsEl =
                document.getElementById(
                    "edgetabs"
                );

            const div =
                document.createElement(
                    "div"

            div.className =
                "tab";

                >
                    x
                </button>
            `;

            div.onclick = () =>
                edgeSwitchTab(div);

            tabsEl.insertBefore(
                div,
                tabsEl.lastElementChild
            );

            edgeTabs.push({
                title:"New tab",
                url:home,
                history:[home],
                historyIndex:0
            });

            edgeSwitchTab(div);
        };

        window.edgeSwitchTab =
            tab => {

            const tabsEl =
                document.getElementById(
                    "edgetabs"
                );

            tabsEl
                .querySelectorAll(
                    ".tab"
                )
                .forEach(t =>
                    t.classList.remove(
                        "active"
                    )
                );

            tab.classList.add(
                "active"
            );

            const current =
                edgeCurrentTab();

            document.getElementById(
                "edgebar"
            ).value =
                current.url;

            document.getElementById(
                "edgeframe"
            ).src =
                current.url;
        };

        window.edgeCloseTab =
            (event,button) => {

            event.stopPropagation();

            const tab =
                button.parentElement;

            const tabsEl =
                document.getElementById(
                    "edgetabs"
                );

            const tabs =
                Array.from(
                    tabsEl.querySelectorAll(
                        ".tab"
                    )
                );

            const index =
                tabs.indexOf(tab);

            edgeTabs.splice(
                index,
                1
            );

            tab.remove();

            const remaining =
                tabsEl.querySelectorAll(
                    ".tab"
                );

            if (!remaining.length) {

                const frame =
                    document.getElementById(
                        "edgeframe"
                    );

                if (frame) {

                    const win =
                        frame.closest(
                            ".window"
                        );

                    if (win) {

                        removeTaskbarButton(
                            win

                        win.remove();
                    }
                }

                return;
            }

            const active =
                tabsEl.querySelector(
                    ".tab.active"
                );

            if (!active) {

                const newActive =
                    remaining[
                        Math.max(
                            0,
                            Math.min(
                                index - 1,
                                remaining.length - 1
                            )
                        )
                    ];

                edgeSwitchTab(
                    newActive
                );
            }
        };
    }

                            flex:1;
                            overflow:auto;
                            border-top:1px solid #ddd;
                            padding-top:12px;
                        "
                    ></div>

                </div>
                `

            controlPanelHome(
                controlPanel.querySelector(
                    ".control-panel button"

            );

            return;
        }
    };

    function controlPanelGetRoot(element) {

        const win =
            element.closest(
                ".window"
            );

        return win &&
            win.querySelector(
                ".control-panel"
            );
    }


    window.controlPanelHome =
        element => {

        const root =
            controlPanelGetRoot(
                element
            );

        if (!root)
            return;

        root.querySelector(
            ".cp-breadcrumb"
        ).textContent =
            "Control Panel";

        root.querySelector(
            ".cp-content"
        ).innerHTML = `

            <div style="
                display:flex;
                align-items:center;
                gap:10px;
                margin-bottom:14px;
            ">

                <img
                    src="https://www.pngkey.com/png/full/336-3368717_admindashboard-windows-control-panel-icon.png"
                    width="42"
                    height="42"
                    alt="Control Panel"
                    onerror="
                        this.style.display='none'
                    "
                >

                <div>

                    <div style="
                        font-size:20px;
                        font-weight:600;
                    ">
                        Control Panel
                    </div>

                    <div style="
                        font-size:12px;
                        color:#666;
                    ">
                        Adjust your computer's settings
                    </div>

                </div>

            </div>

            <div style="
                display:grid;
                grid-template-columns:
                    repeat(2,minmax(0,1fr));
                gap:8px;
            ">

                ${Object.keys(cpPages)
                    .map(name => `
                        <button
                            onclick="
                                controlPanelOpen(
                                    this,
                                    ${JSON.stringify(name)}
                                )
                            "
                            style="
                                text-align:left;
                                padding:10px;
                                min-height:64px;
                                display:flex;
                                align-items:center;
                                gap:10px;
                            "
                        >

                            <span style="
                                font-size:24px;
                                width:30px;
                                text-align:center;
                            ">
                                ${cpPages[name].icon}
                            </span>

                            <span>
                                <strong>
                                    ${name}
                                </strong>

                                <br>

                                <small style="
                                    color:#666;
                                ">
                                    View related settings
                                </small>
                            </span>

                        </button>
                    `).join("")}

            </div>
        `;
    };


    window.controlPanelOpen =
        (element,name) => {

        const root =
            controlPanelGetRoot(
                element
            );

        const page =
            cpPages[name];

        if (
            !root ||
            !page
        )
            return;

        root.querySelector(
            ".cp-breadcrumb"
        ).textContent =
            "Control Panel › " +
            name;

        root.querySelector(
            ".cp-content"
        ).innerHTML = `

            <div style="
                display:flex;
                align-items:center;
                gap:10px;
                margin-bottom:12px;
            ">

                <span style="
                    font-size:30px;
                ">
                    ${page.icon}
                </span>

                <div>

                    <div style="
                        font-size:20px;
                        font-weight:600;
                    ">
                        ${name}
                    </div>

                    <div style="
                        font-size:12px;
                        color:#666;
                    ">
                        Choose a task
                    </div>

                </div>

            </div>

            <div style="
                display:flex;
                flex-direction:column;
                gap:7px;
            ">

                ${page.items.map(
                    (item,i) => `

                    <button
                        onclick="
                            controlPanelTask(
                                this,
                                ${JSON.stringify(name)},
                                ${i}
                            )
                        "
                        style="
                            text-align:left;
                            padding:9px;
                        "
                    >

                        <strong style="
                            color:#0645ad;
                        ">
                            ${item[0]}
                        </strong>

                        <br>

                        <span style="
                            font-size:12px;
                            color:#555;
                        ">
                            ${item[1]}
                        </span>

                    </button>

                `).join("")}

            </div>

            <div
                class="cp-status"
                style="
                    margin-top:14px;
                    padding:9px;
                    background:#f4f4f4;
                    border:1px solid #ddd;
                    font-size:12px;
                    color:#444;
                "
            >
                Select a task above.
            </div>
        `;
    };


    window.controlPanelTask =
        (element,name,index) => {

        const root =
            controlPanelGetRoot(
                element
            );

        const item =
            cpPages[name]?.items[index];

        if (
            !root ||
            !item
        )
            return;

        root.querySelector(
            ".cp-status"
        ).innerHTML =
            "<strong>" +
            item[0] +
            "</strong><br>" +
            item[2];
    };


    window.controlPanelSearch =
        input => {

        const root =
            controlPanelGetRoot(
                input
            );

        if (!root)
            return;

        const q =
            input.value
                .trim()
                .toLowerCase();

        if (!q) {

            controlPanelHome(
                input
            );

            return;
        }

        const matches = [];

        Object.entries(
            cpPages
        ).forEach(
            ([name,page]) => {

                page.items.forEach(
                    (item,index) => {

                        if (
                            (
                                name +
                                " " +
                                item[0] +
                                " " +
                                item[1]
                            )
                            .toLowerCase()
                            .includes(q)
                        ) {

                            matches.push({
                                name,
                                item,
                                index
                            });
                        }
                    }
                );
            }
        );

        root.querySelector(
            ".cp-breadcrumb"
        ).textContent =
            'Search results for "' +
            input.value +
            '"';

        root.querySelector(
            ".cp-content"
        ).innerHTML =
            matches.length
            ? `

                <div style="
                    margin-bottom:10px;
                ">

                    <strong>
                        ${matches.length}
                    </strong>

                    result
                    ${matches.length === 1
                        ? ""
                        : "s"}
                    found.

                </div>

                <div style="
                    display:flex;
                    flex-direction:column;
                    gap:7px;
                ">

                    ${matches.map(
                        m => `

                        <button
                            onclick="
                                controlPanelTask(
                                    this,
                                    ${JSON.stringify(m.name)},
                                    ${m.index}
                                )
                            "
                            style="
                                text-align:left;
                                padding:9px;
                            "
                        >

                            <strong style="
                                color:#0645ad;
                            ">
                                ${m.item[0]}
                            </strong>

                            <br>

                            <small>
                                ${m.name}
                                —
                                ${m.item[1]}
                            </small>

                        </button>

                    `).join("")}

                </div>

                <div
                    class="cp-status"
                    style="
                        margin-top:14px;
                        padding:9px;
                        background:#f4f4f4;
                        border:1px solid #ddd;
                        font-size:12px;
                        color:#444;
                    "
                >
                    Select a search result.
                </div>

            `
            : `

                <div style="
                    padding:20px;
                    text-align:center;
                    color:#666;
                ">
                    No settings matched
                    "${input.value}".
                </div>
            `;
    };


    /* MSN CHAT */

    window.openMSNChat =
        name => {

        createWindow(
            "MSN Messenger - " + name,
            `

            <div style="
                display:flex;
                flex-direction:column;
                height:100%;
            ">

                <div style="
                    flex:1;
                    border:1px solid #ccc;
                    padding:8px;
                    background:#fff;
                    overflow:auto;
                ">

                    <div>

                        <b>
                            ${name}
                        </b>

                        is online.

                    </div>

                </div>

                <div style="
                    display:flex;
                    margin-top:6px;
                    gap:5px;
                ">

                    <input
                        id="msnMessage"
                        style="flex:1;"
                        placeholder="Type a message..."
                        onkeydown="
                            if(event.key==='Enter')
                                sendMSNMessage(this)
                        "
                    >

                    <button
                        onclick="
                            sendMSNMessage(
                                document.getElementById(
                                    'msnMessage'
                                )
                            )
                        "
                    >
                        Send
                    </button>

                </div>

            </div>

            `
        );
    };


    window.sendMSNMessage =
        input => {

        if (
            !input ||
            !input.value.trim()
        )
            return;

        const chat =
            input.closest(
                ".window"
            );

        const content =
            chat.querySelector(
                ".window-body > div"
            );

        const message =
            escapeHtml(
                input.value.trim()
            );

        content.innerHTML += `
            <div style="
                margin-top:5px;
            ">
                <b>
                    You:
                </b>

                ${message}

            </div>
        `;

        input.value = "";

        content.scrollTop =
            content.scrollHeight;
    };


    /* MINESWEEPER */

    window.revealMine =
        (cell,index) => {

        if (
            window.ms.has(index)
        ) {

            cell.innerText =
                "X";

            cell.style.background =
                "#f88";

        } else {

            cell.innerText =
                "";

            cell.style.background =
                "#eee";
        }
    };


    /* INSTALLER */

    window.startInstall =
        () => {

        const progress =
            document.getElementById(
                "installProgress"
            );

        const status =
            document.getElementById(
                "installStatus"
            );

        if (
            !progress ||
            !status
        )
            return;

        let value = 0;

        const timer =
            setInterval(
                () => {

                    value += 5;

                    progress.value =
                        value;

                    status.innerText =
                        value < 100
                        ? "Installing..."
                        : "Installation complete.";

                    if (
                        value >= 100
                    ) {

                        clearInterval(
                            timer
                        );
                    }

                },
                100
            );
    };

});
